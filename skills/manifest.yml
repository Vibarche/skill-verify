version: "0.5"
project: skill-verify
description: >
  Collection de skills de vérification, de fiabilité et de développement agentique pour Claude Code,
  Hermes et les agents compatibles Agent Skills. Comprend le kit projet complet, la vérification par
  exécution, l'audit mémoire, la validation des appels MCP, la gestion des skills et les outils
  d'intégration. Mise à jour v0.5 : enregistrement des 18 skills présents dans le dépôt.

# ─── SKILLS DE VÉRIFICATION ───────────────────────────────────────────

skills:
  - name: verify
    path: skills/verify
    version: "1.1.0"
    description: Mode de vérification persistant avec gates, logs et rapport PASS/ECHEC. Anti-hallucination via Bash + exit codes.
    category: verification
    targets:
      - claude-code
      - agent-skills-compatible
    verification:
      - bash
      - node
      - playwright-optional
    scripts:
      - skills/verify/scripts/check.sh
      - skills/verify/scripts/ci.sh
      - skills/verify/scripts/run-verify.sh
    hooks:
      - skills/verify/hooks/post-task.sh

  - name: verify-feature-end2end
    path: skills/verify-feature-end2end
    version: "1.0.0"
    description: Pipeline e2e — démarre l'app, exerce la feature via HTTP ou navigateur, CI locale, puis PR gate uniquement si PASS.
    category: verification
    targets:
      - claude-code
      - agent-skills-compatible
    verification:
      - bash
      - playwright
      - curl

  - name: verify-context-health
    path: skills/verify-context-health
    version: "1.0.0"
    description: Audit santé contexte agent — token budget au boot, progressive disclosure, skills inutilisées, recommandations de nettoyage.
    category: verification
    targets:
      - claude-code
      - agent-skills-compatible
      - hermes

  - name: verify-unity-playmode
    path: skills/verify-unity-playmode
    version: "1.0.0"
    description: Vérification Unity CLI — tests EditMode/PlayMode, build batchmode, rapport verdict avec logs complets.
    category: verification
    targets:
      - claude-code
      - agent-skills-compatible
      - unity
    verification:
      - unity-cli
      - bash

# ─── PROJECT SUITE (5 SKILLS) ─────────────────────────────────────────

  - name: project-init
    path: skills/project-init
    version: "1.0.0"
    description: Initialise un projet de zéro — brainstorm, PRD, issues GitHub, scaffold, git init.
    category: project-suite
    targets:
      - claude-code
      - agent-skills-compatible
    next: project-build

  - name: project-build
    path: skills/project-build
    version: "1.0.0"
    description: Implémente une feature avec TDD (Red→Green→Refactor) + Gauntlet Loop. Scope strict, diff vérifié avant commit.
    category: project-suite
    targets:
      - claude-code
      - agent-skills-compatible
    previous: project-init
    next: project-test

  - name: project-test
    path: skills/project-test
    version: "1.0.0"
    description: Suite de tests complète — unitaires, intégration, e2e, rapport de couverture, seuils configurables.
    category: project-suite
    targets:
      - claude-code
      - agent-skills-compatible
    previous: project-build
    next: project-ship

  - name: project-ship
    path: skills/project-ship
    version: "1.0.0"
    description: Livraison complète — CHANGELOG, versioning SemVer, build prod, tag Git, déploiement.
    category: project-suite
    targets:
      - claude-code
      - agent-skills-compatible
    previous: project-test
    next: project-review

  - name: project-review
    path: skills/project-review
    version: "1.0.0"
    description: Revue complète — code quality, architecture, performance, sécurité, DX. Rapport structuré avec recommandations.
    category: project-suite
    targets:
      - claude-code
      - agent-skills-compatible
    previous: project-ship

# ─── RELIABILITY SUITE ────────────────────────────────────────────────

  - name: agent-memory-audit
    path: skills/agent-memory-audit
    version: "1.0.0"
    description: Audit basé sur les preuves des fichiers mémoire agent — liens cassés, statuts manquants et affirmations non supportées.
    category: reliability
    targets:
      - claude-code
      - agent-skills-compatible
    scripts:
      - skills/agent-memory-audit/scripts/agent_memory_audit.py

  - name: mcp-agent-hallucination-check
    path: skills/mcp-agent-hallucination-check
    version: "1.1.0"
    description: Vérification statique et read-only des appels MCP déclarés — outils inventés, arguments invalides, secrets exposés et appels destructifs.
    category: reliability
    targets:
      - claude-code
      - agent-skills-compatible
    scripts:
      - skills/mcp-agent-hallucination-check/scripts/mcp_contract_check.py

# ─── AI SPRINT SUITE ──────────────────────────────────────────────────

  - name: connect-tool
    path: skills/connect-tool
    version: "1.0.0"
    description: Connecte un service externe approuvé via son CLI officiel ou génère un CLI Python minimal, avec validation read-only.
    category: ai-sprint
    targets:
      - claude-code
      - agent-skills-compatible

  - name: setup-brain
    path: skills/setup-brain
    version: "2.1.0"
    description: Initialise ou étend un brain agent — AGENTS.md, hubs projets, notes, règles de travail et historique Git.
    category: ai-sprint
    targets:
      - claude-code
      - agent-skills-compatible

  - name: skill-manager
    path: skills/skill-manager
    version: "2.1.0"
    description: Installe, liste, met à jour, supprime, crée, améliore et audite les Agent Skills pour Claude Code et Codex.
    category: ai-sprint
    targets:
      - claude-code
      - agent-skills-compatible
    scripts:
      - skills/skill-manager/scripts/skills.sh

# ─── SKILLS EXISTANTS ─────────────────────────────────────────────────

  - name: skill-architect
    path: skills/skill-architect
    version: "1.2.0"
    description: Conçoit, audite et refactore des skills et system prompts. Crée des SKILL.md production-ready avec frontmatter, trigger, sécurité et evals.
    category: meta
    targets:
      - claude-code
      - agent-skills-compatible

  - name: gauntlet-loop-dev
    path: skills/gauntlet-loop-dev
    version: "1.1.0"
    description: Boucle builder-critic pour itérer vers une barre de qualité concrète — UI, API, script ou feature avec TDD et preuves exécutables.
    category: quality
    targets:
      - claude-code
      - agent-skills-compatible

  - name: indagis-feature-builder
    path: skills/indagis-feature-builder
    version: "1.1.0"
    description: Construit les features Indagis Agent une par une — spec-first, scope strict, diff vérifié, flux réel rejoué avant commit.
    category: project-suite
    targets:
      - claude-code
      - agent-skills-compatible

  - name: unity-gamedev
    path: skills/unity-gamedev
    version: "1.0.0"
    description: Développement Unity — scripts C#, prefabs, scènes, architecture de projet, bonnes pratiques GameDev avec Claude Code.
    category: gamedev
    targets:
      - claude-code
      - agent-skills-compatible
      - unity
